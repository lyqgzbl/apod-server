services:
  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: apod-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      GIN_MODE: release
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1}
      API_AUTH_KEY: ${API_AUTH_KEY:?API_AUTH_KEY is required}
      METRICS_AUTH_KEY: ${METRICS_AUTH_KEY:?METRICS_AUTH_KEY is required}
      API_ALLOW_DEMO_KEY: ${API_ALLOW_DEMO_KEY:-false}
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      NASA_API_KEY: ${NASA_API_KEY:-DEMO_KEY}
      IMAGE_CACHE_DIR: /app/cache/images
      API_RATE_LIMIT_RPS: ${API_RATE_LIMIT_RPS:-8}
      API_RATE_LIMIT_BURST: ${API_RATE_LIMIT_BURST:-16}
      MEMORY_CACHE_TTL_MINUTES: ${MEMORY_CACHE_TTL_MINUTES:-180}
      MEMORY_CACHE_MAX_ITEMS: ${MEMORY_CACHE_MAX_ITEMS:-2000}
      MEMORY_CACHE_CLEANUP_MINUTES: ${MEMORY_CACHE_CLEANUP_MINUTES:-15}
      IMAGE_CACHE_MAX_FILES: ${IMAGE_CACHE_MAX_FILES:-1000}
      IMAGE_CACHE_MAX_AGE_HOURS: ${IMAGE_CACHE_MAX_AGE_HOURS:-720}
      IMAGE_DOWNLOAD_MAX_BYTES: ${IMAGE_DOWNLOAD_MAX_BYTES:-26214400}
    volumes:
      - app_cache:/app/cache
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: apod-prometheus
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      METRICS_AUTH_KEY: ${METRICS_AUTH_KEY:?METRICS_AUTH_KEY is required}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.expand-env
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: apod-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: apod-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  app_cache:
  grafana_data:
  prometheus_data:
  redis_data:
